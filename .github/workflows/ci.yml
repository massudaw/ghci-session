name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The library (the `ghci-hygiene` package, hygiene/) and the `ghci-session` command, on each GHC they build with. (The engine is a
  # vendored GHC 9.14.1 front end for macOS, so it is built in its own job below.)
  build:
    name: GHC ${{ matrix.ghc }} (linux)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ["9.6.7", "9.10.3", "9.14.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('ghci-session.cabal', 'hygiene/ghci-hygiene.cabal') }}
          restore-keys: ${{ runner.os }}-ghc-${{ matrix.ghc }}-
      - name: Build
        run: cabal build --ghc-options=-Werror lib:ghci-hygiene exe:ghci-session
      - name: Self-test
        run: $(cabal list-bin -v0 exe:ghci-session) selftest

  # GHCi itself (engine/GhsEngine.hs), vendored for GHC 9.14.1 and built for macOS.
  engine:
    name: GHC 9.14.1 (macos, with the engine)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: "9.14.1"
          cabal-version: latest
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc-9.14.1-${{ hashFiles('ghci-session.cabal', 'hygiene/ghci-hygiene.cabal') }}
          restore-keys: ${{ runner.os }}-ghc-9.14.1-
      - name: Build both executables
        run: ./build.sh
      - name: Self-test
        run: .bin/ghci-session selftest
